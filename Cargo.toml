[package]
name = "tradex-program"
version = "0.1.0"
edition = "2021"
description = "Solana perpetual futures exchange for Pokemon card prices"
license = "BUSL-1.1"
repository = "https://github.com/ankushKun/tradex-perp-program"
authors = ["ankushKun"]

[features]
logging = []

[dependencies]
pinocchio = { version = "0.10.1", features = ["cpi", "copy"] }
pinocchio-log = { version = "0.5" }
pinocchio-pubkey = { version = "0.3", features = ["const"] }
pinocchio-system = { version = "0.5" }
pinocchio-token = { version = "0.5" }

[target.'cfg(not(any(target_os = "solana", target_arch = "bpf")))'.dependencies]
solana-pubkey = { version = "4.0.0", features = ["curve25519"] }

[lib]
name = "tradex_program"
crate-type = ["cdylib", "lib"]

[dev-dependencies]
mollusk-svm = "0.10.3"
mollusk-svm-programs-token = "0.10.3"
solana-pubkey = { version = "4.0", features = ["rand"] }
solana-instruction = "3.1"
solana-account = "3.4"
solana-sdk-ids = "3.1"
solana-rent = "3.1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
